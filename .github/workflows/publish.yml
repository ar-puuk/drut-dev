name: Publish

# G1/G2 (ROADMAP.md item 8): publishes drut to the VS Code Marketplace, Open
# VSX, and crates.io. Manual-only, on purpose -- modeled on
# ar-puuk/omx-viewer's publish-extension.yml, but diverges from it in three
# deliberate ways:
#   1. No push trigger at all. The reference workflow packages a .vsix on
#      every push to main (safe, since packaging alone publishes nowhere)
#      and only gates the actual publish steps behind workflow_dispatch.
#      This workflow never runs unattended, full stop -- the highest-
#      consequence automation in the project gets the highest bar.
#   2. `vsce package`/`publish` here do NOT use `--no-dependencies` --
#      unlike the reference extension, drut-voyager has a real runtime
#      dependency (vscode-languageclient) that needs to be bundled in.
#   3. `concurrency.cancel-in-progress` is false, not true -- killing a
#      publish workflow mid-sequence (e.g. after voyager-core succeeds but
#      before drut-config) is worse than making a second dispatch wait.
#
# This workflow only publishes what release.yml already built, tested, and
# tagged -- it never bumps a version or decides one itself.
on:
  workflow_dispatch:
    inputs:
      publish_extension:
        description: 'Publish to VS Code Marketplace + Open VSX (VSCE_PAT / OVSX_PAT)'
        type: boolean
        default: false
      publish_crates:
        description: 'Publish to crates.io (CARGO_REGISTRY_TOKEN), voyager-core -> drut-config -> drut-lsp/drut-mcp -> drut-cli'
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Verify lockstep versions and rehearse packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Confirm all six packages report the same version
        # Runs unconditionally, regardless of which target(s) this dispatch
        # is publishing -- lockstep versioning (CONTRIBUTING.md's
        # "Versioning" section) is a standing invariant of the repo state
        # itself, not something that only matters when publishing both
        # targets in the same run. Scoping this to only the package(s)
        # about to be published would make the check vacuous in standalone
        # mode (a single value always equals itself) and silently allow the
        # exact drift this exists to catch -- see the extension's own
        # 0.2.0-vs-0.1.0 mismatch found and fixed just before the v0.1.0
        # release.
        shell: bash
        run: |
          set -euo pipefail
          EXT_VERSION=$(node -p "require('./editors/vscode/package.json').version")
          echo "Extension (package.json): $EXT_VERSION"
          FAILED=0
          for manifest in crates/*/Cargo.toml; do
            CRATE_VERSION=$(grep -m1 '^version' "$manifest" | sed -E 's/version *= *"([^"]+)"/\1/')
            echo "$manifest: $CRATE_VERSION"
            if [ "$CRATE_VERSION" != "$EXT_VERSION" ]; then
              echo "::error file=$manifest::version $CRATE_VERSION does not match extension version $EXT_VERSION"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Lockstep versioning violated -- all six packages (voyager-core, drut-config, drut-cli, drut-lsp, drut-mcp, and the VS Code extension) must report the same version before publishing either target."
            exit 1
          fi
          echo "All six packages report version $EXT_VERSION -- lockstep versioning confirmed."

      - name: cargo publish --dry-run for voyager-core
        # Packaging-only rehearsal -- verifies Cargo.toml completeness and
        # included-file correctness without uploading anything.
        #
        # Deliberately scoped to voyager-core only, not all five crates:
        # confirmed by hand (see this workflow's own commit message) that
        # `cargo publish --dry-run` validates a dependency that carries
        # both `path` AND `version` (every internal dependency in this
        # workspace, added specifically for crates.io publishing) against
        # the *real* crates.io registry, not the local path -- even in
        # dry-run mode. voyager-core has zero internal dependencies, so its
        # own dry-run is always meaningful. drut-config/drut-lsp/drut-mcp/
        # drut-cli's dry-run can only succeed once their own dependencies
        # already exist on crates.io -- true for a future patch release,
        # never true for this workspace's first-ever publish. Rehearsing
        # those four here would either be a guaranteed false failure (on
        # this first publish) or silently skipped (defeating the point) --
        # neither is worth the complexity. The real publish-crates job's
        # sequential publish + index-propagation wait is what actually
        # proves the chain, in the order it truly depends on.
        shell: bash
        run: cargo publish --dry-run -p voyager-core

  publish-extension:
    name: Publish extension (VS Code Marketplace + Open VSX)
    needs: preflight
    if: ${{ inputs.publish_extension }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Compile
        working-directory: editors/vscode
        run: npm run compile

      - name: Test
        # Re-verified immediately before a public publish, not assumed from
        # an earlier CI run against a possibly-different commit.
        working-directory: editors/vscode
        run: npm test

      - name: Package .vsix
        working-directory: editors/vscode
        run: npx @vscode/vsce package

      - name: Upload .vsix artifact
        # Audit trail of exactly what got published, independent of the
        # publish steps below succeeding or failing.
        uses: actions/upload-artifact@v4
        with:
          name: drut-voyager-vsix
          path: editors/vscode/*.vsix

      - name: Publish to VS Code Marketplace
        working-directory: editors/vscode
        run: |
          set -euo pipefail
          VSIX=$(ls *.vsix)
          npx @vscode/vsce publish --packagePath "$VSIX" -p "${{ secrets.VSCE_PAT }}"

      - name: Publish to Open VSX
        working-directory: editors/vscode
        run: |
          set -euo pipefail
          VSIX=$(ls *.vsix)
          npx ovsx publish "$VSIX" -p "${{ secrets.OVSX_PAT }}"

  publish-crates:
    name: Publish crates (crates.io)
    needs: preflight
    if: ${{ inputs.publish_crates }}
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Publish in strict dependency order
        # Fails fast (set -euo pipefail) and stops the whole sequence the
        # moment any crate fails to publish, rather than attempting the
        # next crate against a broken dependency chain. Each publish is
        # followed by a poll against crates.io's real API confirming the
        # just-published version is actually live before the next crate
        # (which may depend on it via a *registry*, not path, reference)
        # attempts to publish -- cheap insurance against an index-
        # propagation race, not a blind sleep.
        shell: bash
        run: |
          set -euo pipefail

          wait_for_crate() {
            local crate="$1" version="$2" waited=0
            until curl -sf "https://crates.io/api/v1/crates/${crate}/${version}" > /dev/null; do
              waited=$((waited + 5))
              if [ "$waited" -ge 120 ]; then
                echo "::error::Timed out waiting for $crate@$version to appear on crates.io after 120s"
                exit 1
              fi
              echo "Waiting for $crate@$version to appear on crates.io (${waited}s elapsed)..."
              sleep 5
            done
            echo "$crate@$version confirmed live on crates.io."
          }

          VERSION=$(grep -m1 '^version' crates/voyager-core/Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          echo "Publishing version $VERSION"

          for crate in voyager-core drut-config drut-lsp drut-mcp drut-cli; do
            echo "::group::cargo publish -p $crate"
            cargo publish -p "$crate"
            wait_for_crate "$crate" "$VERSION"
            echo "::endgroup::"
          done

          echo "All 5 crates published successfully: version $VERSION"
