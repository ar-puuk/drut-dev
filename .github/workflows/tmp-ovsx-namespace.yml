name: Temporary OVSX Namespace Check

# One-off, throwaway workflow: creates the arpuuk namespace on Open VSX if it
# doesn't already exist (harmless/idempotent if it does). Added directly to
# main only because workflow_dispatch requires a workflow to exist on the
# default branch to be dispatchable at all -- removed again once confirmed.
on:
  workflow_dispatch:

jobs:
  create-namespace:
    runs-on: ubuntu-latest
    steps:
      - run: npx --yes ovsx create-namespace arpuuk -p "${{ secrets.OVSX_PAT }}"
