[package]
name = "drut-cli"
version = "0.3.1"
edition = "2021"
description = "Drut CLI: check and format subcommands over voyager-core"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ar-puuk/drut-dev"

[[bin]]
name = "drut"
path = "src/main.rs"

# Not bound by voyager-core's zero-dependency rule (that constraint is scoped
# to the core crate specifically — see 002-cli-check-format/spec.md
# Assumptions). Versions pinned per research.md §6.
[dependencies]
voyager-core = { path = "../voyager-core", version = "0.3.1" }
drut-config = { path = "../drut-config", version = "0.3.1" }
drut-lsp = { path = "../drut-lsp", version = "0.3.1" }
drut-mcp = { path = "../drut-mcp", version = "0.3.1" }
clap = { version = "4.6.6", features = ["derive"] }
ignore = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.1.2"
lsp-server = "0.10.0"
# Only mcp_cmd.rs's own dispatch arm ever constructs a runtime from this --
# check/format/server stay fully synchronous (004-mcp-server/research.md §2).
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
jsonschema = "0.49.8"
# 012-toml-configuration's config_parity.rs three-surface test drives
# drut-lsp's real handler functions directly, which need lsp-types' request/
# response shapes -- same version drut-lsp itself pins.
lsp-types = "0.97.0"
