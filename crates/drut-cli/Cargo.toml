[package]
name = "drut-cli"
version = "0.1.0"
edition = "2021"
description = "Drut CLI: check and format subcommands over voyager-core"
license = "MIT OR Apache-2.0"

[[bin]]
name = "drut"
path = "src/main.rs"

# Not bound by voyager-core's zero-dependency rule (that constraint is scoped
# to the core crate specifically — see 002-cli-check-format/spec.md
# Assumptions). Versions pinned per research.md §6.
[dependencies]
voyager-core = { path = "../voyager-core" }
clap = { version = "4.6.6", features = ["derive"] }
ignore = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.1.2"

[dev-dependencies]
jsonschema = "0.49.8"
