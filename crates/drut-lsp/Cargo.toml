[package]
name = "drut-lsp"
version = "0.3.1"
edition = "2021"
description = "Drut LSP server: diagnostics, hover, completion, spell-check, and semantic tokens over voyager-core"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ar-puuk/drut-dev"

# Not bound by voyager-core's zero-dependency rule (scoped to the core crate
# specifically). Versions pinned per research.md §11.
[dependencies]
voyager-core = { path = "../voyager-core", version = "0.3.1" }
drut-config = { path = "../drut-config", version = "0.3.1" }
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde = "1.0.229"
serde_json = "1.0.151"

[dev-dependencies]
