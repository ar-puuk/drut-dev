[package]
name = "drut-mcp"
version = "0.1.0"
edition = "2021"
description = "Drut MCP server: read-only diagnose/format/query_structure/lookup_keyword tools over voyager-core"
license = "MIT OR Apache-2.0"

# Not bound by voyager-core's zero-dependency rule (scoped to this crate
# specifically, research.md §2/§6). `tokio` is this project's first async
# runtime dependency -- every actively-maintained Rust MCP SDK is async-only
# (research.md §1) -- but it stops here: voyager-core, drut-cli's other
# subcommands, and drut-lsp remain fully synchronous (T004 verifies this).
[dependencies]
voyager-core = { path = "../voyager-core" }
# schemars pinned to "1" (not "0.8") deliberately -- rmcp 3.1.2 itself
# depends on schemars 1.2.2 for its own #[tool] macro's schema generation,
# confirmed via `cargo tree -i schemars@1.2.2`; deriving JsonSchema from a
# different major version would produce a trait implementation rmcp's macro
# can't actually use, even though the trait name is identical.
rmcp = { version = "~3.1", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
